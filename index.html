<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor Deportivo Pro - IA & Stats</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽🏀 Sports Value Predictor</h1>
            <p>Modelo estadístico y cálculo de probabilidades +EV</p>
        </header>

        <main class="card">
            <h2>Simulador de Encuentro (Fútbol - Poisson)</h2>
            
            <div class="form-grid">
                <div class="input-group">
                    <label for="selectLocal">Equipo Local</label>
                    <input type="text" id="selectLocal" placeholder="Ej. México" value="México">
                </div>

                <div class="input-group">
                    <label for="selectVisita">Equipo Visitante</label>
                    <input type="text" id="selectVisita" placeholder="Ej. Jamaica" value="Jamaica">
                </div>
            </div>

            <div class="form-grid-stats">
                <div class="input-group">
                    <label>Ataque Local (xG)</label>
                    <input type="number" id="atkLocal" value="1.60" step="0.05">
                </div>
                <div class="input-group">
                    <label>Defensa Visita</label>
                    <input type="number" id="defVisita" value="0.90" step="0.05">
                </div>
                <div class="input-group">
                    <label>Ataque Visita (xG)</label>
                    <input type="number" id="atkVisita" value="1.10" step="0.05">
                </div>
                <div class="input-group">
                    <label>Defensa Local</label>
                    <input type="number" id="defLocal" value="0.80" step="0.05">
                </div>
            </div>

            <button id="btnAnalizar" class="btn-primary">Ejecutar Modelo Predictivo</button>
        </main>

        <!-- Resultados del Análisis -->
        <section id="resultadoContainer" class="results-card hidden">
            <h3>📊 Resultados del Modelo</h3>
            <div id="outputContenido"></div>
        </section>
    </div>

    <!-- Script Principal (Módulo de JS) -->
    <script type="module" src="script.js"></script>
</body>
</html>
